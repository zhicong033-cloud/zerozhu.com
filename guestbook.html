<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>订阅与留言 - ZeroZhu</title>
  <meta name="description" content="订阅 ZeroZhu，并在网页内直接留言交流。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="top">
      <a class="brand" href="index.html">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>ZERO ZHU</div>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="ideas/index.html">创作</a>
        <a href="about.html">关于</a>
        <a class="primary active" href="guestbook.html">订阅</a>
      </nav>
    </header>

    <a class="back-link" href="index.html">← 返回首页</a>

    <header class="page-hero accent-red">
      <div class="meta-row">
        <span class="tag red">SUBSCRIBE</span>
      </div>
      <h1>订阅与留言</h1>
      <p class="lead">扫码关注各平台，或直接在下方留言——留言保存在本站，不用跳到 GitHub。</p>
      <div class="pill-row">
        <span class="pill yellow">订阅入口</span>
        <span class="pill red">网页留言</span>
      </div>
    </header>

    <div class="section-title" id="subscribe-qr">
      <h3>扫码关注</h3>
      <span>公众号 / 小红书 / 抖音 / 视频号</span>
    </div>
    <div class="qr-grid">
      <div class="qr-card">
        <img src="assets/social/wechat-mp.jpg" alt="微信公众号二维码" />
        <div class="label">公众号</div>
        <div class="sub">忙而不匆1802</div>
      </div>
      <div class="qr-card">
        <img src="assets/social/xiaohongshu.jpg" alt="小红书二维码" />
        <div class="label">小红书</div>
        <div class="sub">朱智聪Zero</div>
      </div>
      <div class="qr-card">
        <img src="assets/social/douyin.jpg" alt="抖音二维码" />
        <div class="label">抖音</div>
        <div class="sub">朱智聪Zero</div>
      </div>
      <div class="qr-card">
        <img src="assets/social/shipinhao.jpg" alt="视频号二维码" />
        <div class="label">视频号</div>
        <div class="sub">扫码关注</div>
      </div>
    </div>

    <section class="content-card" aria-label="网页留言板" style="margin-top:28px">
      <h2 class="section-title" style="margin:0 0 8px">留言板</h2>
      <p class="prose">随便聊聊 AI、合作或生活。提交后会立刻显示在本页。</p>
      <p class="prose">邮箱：<a href="mailto:zhicong033@gmail.com">zhicong033@gmail.com</a></p>
      <form id="guestbook-form" class="guestbook-form">
        <label>昵称<input name="name" type="text" maxlength="40" placeholder="怎么称呼你" /></label>
        <label>联系方式（选填）<input name="contact" type="text" maxlength="80" placeholder="邮箱 / 微信 / 其他" /></label>
        <label>留言<textarea name="message" required maxlength="800" rows="5" placeholder="想说的话…"></textarea></label>
        <button class="btn" type="submit">发布留言</button>
        <p id="guestbook-status" class="guestbook-status" aria-live="polite"></p>
      </form>
      <div id="guestbook-list" class="guestbook-list" aria-live="polite"></div>
    </section>

    <footer class="footer">
      <div>© 2026 ZeroZhu</div>
      <div class="footer-links">
        <a href="index.html">首页</a>
        <a href="ideas/index.html">创作</a>
        <a href="about.html">关于</a>
      </div>
    </footer>
  </div>
  <script src="assets/site-stats.js" defer></script>
  <script src="assets/guestbook.js" defer></script>
</body>
</html>
