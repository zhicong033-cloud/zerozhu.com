<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>订阅与留言 - ZeroZhu</title>
  <meta name="description" content="订阅 ZeroZhu，查看网站访问数据，并在网页内直接留言交流。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="top">
      <a class="brand" href="index.html">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>ZERO ZHU</div>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="ideas/index.html">创作</a>
        <a href="about.html">关于</a>
        <a class="primary active" href="guestbook.html">订阅</a>
      </nav>
    </header>

    <a class="back-link" href="index.html">← 返回首页</a>

    <header class="page-hero accent-red">
      <div class="meta-row">
        <span class="tag red">SUBSCRIBE</span>
      </div>
      <h1>订阅与留言</h1>
      <p class="lead">扫码关注各平台，看看站点热度，或直接在下方留言——留言保存在本站。</p>
      <div class="pill-row">
        <span class="pill yellow">订阅入口</span>
        <span class="pill red">访问数据</span>
        <span class="pill">网页留言</span>
      </div>
    </header>

    <div class="section-title" id="site-stats">
      <h3>站点数据</h3>
      <span>今日实时 · 按上海时区</span>
    </div>
    <section id="site-stats-panel" class="stats-panel" aria-label="网站访问数据">
      <div class="stat-card accent-yellow">
        <div class="stat-label">今日浏览</div>
        <div class="stat-value" data-k="todayViews">—</div>
      </div>
      <div class="stat-card accent-blue">
        <div class="stat-label">今日点击</div>
        <div class="stat-value" data-k="todayClicks">—</div>
      </div>
      <div class="stat-card accent-green">
        <div class="stat-label">累计浏览</div>
        <div class="stat-value" data-k="totalViews">—</div>
      </div>
    </section>

    <div class="section-title" id="subscribe-qr">
      <h3>扫码关注</h3>
      <span>公众号 / 小红书 / 抖音 / 视频号</span>
    </div>
    <div class="qr-grid">
      <div class="qr-card">
        <img src="assets/social/wechat-mp.jpg" alt="微信公众号二维码" />
        <div class="label">公众号</div>
        <div class="sub">忙而不匆1802</div>
      </div>
      <div class="qr-card">
        <img src="assets/social/xiaohongshu.jpg" alt="小红书二维码" />
        <div class="label">小红书</div>
        <div class="sub">朱智聪Zero</div>
      </div>
      <div class="qr-card">
        <img src="assets/social/douyin.jpg" alt="抖音二维码" />
        <div class="label">抖音</div>
        <div class="sub">朱智聪Zero</div>
      </div>
      <div class="qr-card">
        <img src="assets/social/shipinhao.jpg" alt="视频号二维码" />
        <div class="label">视频号</div>
        <div class="sub">扫码关注</div>
      </div>
    </div>

    <div class="section-title" style="margin-top:28px">
      <h3>留言板</h3>
      <span>保存在本站 · 提交即显示</span>
    </div>
    <section class="content-card guestbook-card" aria-label="网页留言板">
      <p class="prose guestbook-intro">随便聊聊 AI、合作或生活。也可以发邮件：<a href="mailto:zhicong033@gmail.com">zhicong033@gmail.com</a></p>
      <form id="guestbook-form" class="guestbook-form">
        <div class="guestbook-row">
          <label class="field">
            <span class="field-label">昵称</span>
            <input name="name" type="text" maxlength="40" placeholder="怎么称呼你" autocomplete="nickname" />
          </label>
          <label class="field">
            <span class="field-label">联系方式 <em>选填</em></span>
            <input name="contact" type="text" maxlength="80" placeholder="邮箱 / 微信 / 其他" autocomplete="email" />
          </label>
        </div>
        <label class="field field-full">
          <span class="field-label">留言</span>
          <textarea name="message" required maxlength="800" rows="5" placeholder="想说的话…"></textarea>
        </label>
        <div class="guestbook-actions">
          <button class="btn" type="submit">发布留言</button>
          <p id="guestbook-status" class="guestbook-status" aria-live="polite"></p>
        </div>
      </form>
      <div id="guestbook-list" class="guestbook-list" aria-live="polite"></div>
    </section>

    <footer class="footer">
      <div>© 2026 ZeroZhu</div>
      <div class="footer-links">
        <a href="index.html">首页</a>
        <a href="ideas/index.html">创作</a>
        <a href="about.html">关于</a>
      </div>
    </footer>
  </div>
  <script src="assets/site-stats.js" defer></script>
  <script src="assets/guestbook.js" defer></script>
</body>
</html>
